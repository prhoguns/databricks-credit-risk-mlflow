name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }  # matches the Databricks Runtime 17 Python
      - run: pip install -r requirements.txt
      - name: Run the three notebooks on local Spark
        run: WORK_DIR=$PWD/lake python tests/run_local.py
      - name: Export MLflow runs
        run: MLFLOW_TRACKING_URI=sqlite:///$PWD/lake/mlflow.db python tests/export_runs.py
